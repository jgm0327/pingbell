spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pingbell}
    username: ${POSTGRES_USER:pingbell}
    password: ${POSTGRES_PASSWORD:pingbell1234!!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PINGBELL_KAFKA_CONSUMER_GROUP_ID:pingbell-check-worker}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.monit.pingbell.check.scheduler.event
        spring.json.value.default.type: com.monit.pingbell.check.scheduler.event.HealthCheckRequestedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 360000
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
  remember-me-refresh-token-expiration-ms: ${JWT_REMEMBER_ME_REFRESH_TOKEN_EXPIRATION_MS:2592000000}

pingbell:
  check:
    dispatch-mode: ${PINGBELL_CHECK_DISPATCH_MODE:direct}
    kafka:
      consumer:
        group-id: ${PINGBELL_KAFKA_CONSUMER_GROUP_ID:pingbell-check-worker}
      topic:
        health-check-requested: ${PINGBELL_KAFKA_TOPIC_HEALTH_CHECK_REQUESTED:pingbell.health-check.requested}
  security:
    notification-target-key: ${NOTIFICATION_TARGET_ENCRYPTION_KEY:${JWT_SECRET:}}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
