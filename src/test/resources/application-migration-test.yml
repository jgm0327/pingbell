spring:
  datasource:
    url: ${MIGRATION_TEST_DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:pingbell}}
    username: ${MIGRATION_TEST_DATABASE_USERNAME:${POSTGRES_USER:pingbell}}
    password: ${MIGRATION_TEST_DATABASE_PASSWORD:${POSTGRES_PASSWORD:pingbell1234!!}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    listener:
      auto-startup: false

jwt:
  secret: test-jwt-secret-key-for-pingbell-migration-test
  access-token-expiration-ms: 3600000

pingbell:
  security:
    notification-target-key: test-notification-target-encryption-key
